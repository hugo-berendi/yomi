manager:
  max_workers: 10
providers:
  zones:
    class: octodns.provider.yaml.YamlProvider
    default_ttl: 300
    enforce_order: true
    # The zone file is generated by Nix, which orders keys by plain byte
    # comparison. The default "natural" mode sorts digits numerically, so
    # protonmail._domainkey before protonmail2._domainkey failed the check.
    order_mode: simple
    directory: this is set by nix :3
  wan:
    class: octodns_ddns.DdnsSource
    types:
      - A
  cloudflare:
    class: octodns_cloudflare.CloudflareProvider
    token: "env/CLOUDFLARE_TOKEN"
zones:
  hugo-berendi.de.:
    sources:
      - zones
      - wan
    targets:
      - cloudflare
