# {{{ Remap prefix to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# }}}
# {{{ Hide status bar
set -g status on
# }}}
# {{{ Don't rename windows automatically
set-option -g allow-rename off
# }}}
# {{{ Fix slow esc key
set -sg escape-time 10
# }}}
# {{{ Visual stuff
# See https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
# }}}
# {{{ Split panes with "-" and "\" 
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %
# }}}
# {{{ Zoom with M-z
bind -n M-z resize-pane -Z
# }}}
# {{{ Vim-mode
set-window-option -g mode-keys vi
# }}}
# {{{ Vim like keybinds for leaving insert mode
unbind [ # unbind the default way to copy text
bind -T prefix j copy-mode # allow exiting insert mode with C-a j
# }}}
# {{{ Vim like keybinds for copying and pasting
bind -T copy-mode-vi p paste-buffer
bind -T copy-mode-vi V send-keys -X rectangle-toggle # Check if this works
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
# }}}
# {{{ Pane navigation shared with Neovim splits
# smart-splits.nvim sets @pane-is-vim on the pane it runs in, which replaces
# the old ps | grep guess at the process name (it had to know about
# .nvim-wrapped). C-h/j/k/l move, M-h/j/k/l resize, across both.
bind-key -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"
bind-key -n "C-\\" if -F "#{@pane-is-vim}" "send-keys C-\\\\" "select-pane -l"

bind-key -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind-key -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
bind-key -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
bind-key -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi "C-\\" select-pane -l
# }}}
# {{{ Clipboard and graphics from inside panes
# OSC 52 copies (Neovim over SSH, see neovim/options.nix) reach the terminal.
set -g set-clipboard on
# snacks.image draws with the kitty graphics protocol, which tmux drops
# unless panes may pass escape sequences through.
set -g allow-passthrough on
# }}}
# {{{ Get titles to work 
set-option -g set-titles on
set-option -g set-titles-string "#T"
# }}}
