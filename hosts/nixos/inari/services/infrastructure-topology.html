<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yomi · Infrastrukturkarte</title>
<style>
  :root {
    color-scheme: dark;
    --ink: var(--foreground, #e6eee8);
    --muted-ink: var(--muted-foreground, #a7bcb2);
    --paper: var(--card, #14231f);
    --line: var(--border, #3d5249);
    --route: var(--chart-2, #81dfbe);
    --backup: var(--chart-4, #f2cc8b);
    --down: var(--destructive, #ff9c92);
    background: var(--background, #0d1714);
    color: var(--ink);
    font: 15px/1.5 var(--font-sans, system-ui, sans-serif);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1000px; margin: auto; padding: clamp(14px, 4vw, 54px); }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(30px, 5vw, 55px); line-height: 1.08; letter-spacing: -.035em; }
  h2 { font-size: 20px; margin-block-end: 12px; }
  header { display: flex; align-items: end; gap: 14px 28px; justify-content: space-between; flex-wrap: wrap; }
  #state, .hint, .node small, .meta { color: var(--muted-ink); }
  #state { font-size: .83rem; }
  section { margin-top: 28px; }
  figure { margin: 0; }
  .topology {
    border: 1px solid var(--line); border-radius: 14px; padding: clamp(4px, 2vw, 20px);
    background: var(--paper);
    --zone: var(--secondary, #192e28);
    --control: var(--chart-5, #d2b6ff);
    --tunnel: var(--chart-1, #92d1ff);
  }
  .topology svg {
    display: block; width: 100%; max-width: 530px; height: auto; margin: auto;
    font-family: system-ui, sans-serif;
  }
  .topology text { fill: var(--ink); font-size: 16px; }
  .topology .detail { fill: var(--muted-ink); font-size: 13px; }
  .topology .host { font-weight: 700; }
  .topology .zone { fill: var(--zone); stroke: var(--muted-ink); stroke-opacity: .55; }
  .topology .box { fill: var(--paper); stroke: var(--muted-ink); }
  .topology a:hover .box, .topology a:focus-visible .box { stroke: var(--route); stroke-width: 2; }
  .topology .wire {
    fill: none; stroke: var(--route); stroke-width: 1.6;
    stroke-linejoin: round; marker-end: url(#arrow);
  }
  .topology .tunnel { stroke: var(--tunnel); stroke-dasharray: 6 4; }
  .topology .control { stroke: var(--control); stroke-dasharray: 2 4; }
  .topology .tunnel-label { fill: var(--tunnel); }
  .topology .control-label { fill: var(--control); }
  .topology .edge-label {
    paint-order: stroke; stroke: var(--zone); stroke-width: 5; stroke-linejoin: round;
  }
  .topology [data-route][hidden] { display: none; }
  .paths { display: grid; gap: 2px; }
  .path {
    list-style: none; padding: 12px; margin: 0; display: flex;
    align-items: center; background: var(--paper); min-width: 0;
  }
  .path:first-child { border-radius: 12px 12px 0 0; }
  .path:last-child { border-radius: 0 0 12px 12px; }
  .node { flex: 1; min-width: 0; padding: 6px 8px; overflow-wrap: anywhere; }
  .node strong, .node small { display: block; }
  .node strong { font-weight: 650; }
  .edge {
    flex: 1.2; min-width: 0; color: var(--route); text-align: center;
    font-size: .76rem; overflow-wrap: anywhere; padding-inline: 4px;
  }
  .edge::after {
    content: ""; display: block; height: 9px; margin-top: 3px;
    background: currentColor;
    clip-path: polygon(0 42%, calc(100% - 7px) 42%, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, calc(100% - 7px) 58%, 0 58%);
  }
  .backups .edge { color: var(--backup); }
  .flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 275px), 1fr)); gap: 20px; }
  .hosts { font-size: .9rem; color: var(--muted-ink); margin-top: 12px; overflow-wrap: anywhere; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input, select {
    font: inherit; color: inherit; background: var(--paper);
    border: 1px solid var(--line); padding: 7px 10px; border-radius: 6px;
  }
  input { flex: 1; min-width: min(190px, 100%); }
  a { color: var(--route); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--route); outline-offset: 3px; }
  ::selection { background: var(--route); color: #102018; }
  .services { list-style: none; margin: 0; padding: 0; }
  .services li {
    display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; border-bottom: 1px solid var(--line); padding: 9px 0;
  }
  .services a { overflow-wrap: anywhere; }
  .meta { font-size: .83rem; }
  .up { color: var(--route); }
  .down { color: var(--down); }
  .hint { margin-top: 8px; font-size: .86rem; }
</style>
<main>
  <header>
    <h1>Infrastrukturkarte</h1>
    <p id="state" role="status">Karte wird geladen …</p>
  </header>
  <section aria-labelledby="access-title">
    <h2 id="access-title">Netzarchitektur</h2>
    <figure class="topology" id="network-map" hidden>
      <svg viewBox="0 0 440 616" role="group" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">Zugangswege zu Inari</title>
        <desc id="diagram-desc">Anfragen aus dem Internet erreichen Inari über Ebisu und einen WireGuard-Tunnel. Das Heimnetz erreicht die Webdienste direkt über nginx.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto-start-reverse">
            <path d="M0 0L8 4L0 8Z" fill="context-stroke"/>
          </marker>
        </defs>

        <g data-route="gateway">
          <rect class="zone" x="12" y="94" width="276" height="182" rx="9"/>
          <text class="host" x="28" y="120">Ebisu</text>
          <text class="detail" x="272" y="120" text-anchor="end">VPS</text>
        </g>
        <rect class="zone" x="12" y="350" width="416" height="254" rx="9"/>
        <text class="host" x="28" y="377">Inari</text>
        <text class="detail" x="412" y="575" text-anchor="end">Heimserver</text>

        <g data-route="gateway">
          <path class="wire" d="M82 54V138"/>
          <text class="detail" x="94" y="78">HTTPS</text>
          <path class="wire control" d="M137 158H165"/>
          <path class="wire" d="M82 182V216"/>
          <text class="detail" x="94" y="204">Proxy</text>
          <path class="wire tunnel" d="M82 258V393"/>
          <text class="detail tunnel-label" x="94" y="300">WireGuard</text>
          <path class="wire control" d="M132 413H157V324H220V182"/>
          <text class="detail control-label" x="232" y="312">WebSocket<tspan x="232" dy="16">via Traefik</tspan></text>
          <rect class="box" x="24" y="14" width="116" height="40" rx="5"/>
          <text x="82" y="39" text-anchor="middle">Internet</text>
          <rect class="box" x="27" y="138" width="110" height="44" rx="5"/>
          <text x="82" y="165" text-anchor="middle">Traefik</text>
          <rect class="box" x="165" y="138" width="110" height="44" rx="5"/>
          <text x="220" y="165" text-anchor="middle">Pangolin</text>
          <rect class="box" x="27" y="216" width="110" height="42" rx="5"/>
          <text x="82" y="242" text-anchor="middle">Gerbil</text>
          <rect class="box" x="32" y="393" width="100" height="42" rx="5"/>
          <text x="82" y="419" text-anchor="middle">Newt</text>
        </g>
        <g data-route="pangolin">
          <path class="wire" d="M82 435V500H146"/>
          <text class="detail" x="94" y="472">HTTP(S)</text>
        </g>
        <g data-route="lan">
          <path class="wire" d="M353 54V393"/>
          <text class="detail" x="365" y="78">HTTPS</text>
          <path class="wire" d="M353 435V500H294"/>
          <text class="detail" x="341" y="472" text-anchor="end">HTTP(S)</text>
          <rect class="box" x="295" y="14" width="116" height="40" rx="5"/>
          <text x="353" y="39" text-anchor="middle">Heimnetz</text>
          <rect class="box" x="303" y="393" width="100" height="42" rx="5"/>
          <text x="353" y="419" text-anchor="middle">nginx</text>
        </g>
        <g data-route="private">
          <path class="wire tunnel" d="M65 435V550"/>
          <rect class="box" x="27" y="550" width="138" height="41" rx="5"/>
          <text x="96" y="575" text-anchor="middle">Private Ziele</text>
          <rect class="box" x="156" y="14" width="128" height="40" rx="5"/>
          <text x="220" y="39" text-anchor="middle">VPN-Client</text>
          <path class="wire tunnel" d="M220 54V78H302V237H137"/>
          <text class="detail tunnel-label edge-label" x="220" y="226" text-anchor="middle">Privater Zugang</text>
        </g>
        <a href="#services-title" data-route="web">
          <rect class="box" x="146" y="474" width="148" height="54" rx="5"/>
          <text x="220" y="497" text-anchor="middle">Webdienste</text>
          <text class="detail" id="route-count" x="220" y="516" text-anchor="middle"></text>
        </a>
      </svg>
      <figcaption class="hosts" id="hosts"></figcaption>
    </figure>
  </section>
  <div class="flows" id="flows"></div>
  <section aria-labelledby="services-title">
    <h2 id="services-title">Webdienste</h2>
    <div class="controls">
      <input type="search" id="search" aria-label="Dienste durchsuchen" placeholder="Dienst oder Hostname suchen">
      <select id="filter" aria-label="Zugangsweg filtern">
        <option value="">Alle Zugangswege</option>
        <option>nginx</option>
        <option>Pangolin</option>
      </select>
    </div>
    <p class="hint" id="total" aria-live="polite"></p>
    <ul class="services" id="services"></ul>
  </section>
  <noscript>Die Infrastrukturkarte benötigt JavaScript.</noscript>
</main>
<script>
"use strict";

const preview = null;
const element = id => document.getElementById(id);
let topology;
let checks = new Map();

function make(tag, value, className) {
  const item = document.createElement(tag);
  if (value !== undefined) item.textContent = value;
  if (className) item.className = className;
  return item;
}

function path(nodes, edges) {
  const row = make("ol", undefined, "path");
  nodes.forEach(([name, detail], index) => {
    if (index) row.append(make("li", edges[index - 1], "edge"));
    const node = make("li", undefined, "node");
    node.append(make("strong", name));
    if (detail) node.append(make("small", detail));
    row.append(node);
  });
  return row;
}

function renderTopology() {
  const routes = {
    gateway: topology.throughGateway,
    lan: topology.services.some(service => service.access === "nginx"),
    pangolin: topology.services.some(service => service.access === "Pangolin"),
    private: topology.privateAccess,
    web: topology.services.length > 0,
  };
  for (const part of document.querySelectorAll("[data-route]")) {
    part.toggleAttribute("hidden", !routes[part.dataset.route]);
  }
  element("route-count").textContent = topology.services.length + " Routen";
  element("hosts").textContent = "Konfigurierte Systeme · " + topology.hosts.join(" · ");
  element("network-map").hidden = false;

  const flows = element("flows");
  flows.replaceChildren();
  for (const scope of [...new Set(topology.flows.map(flow => flow.scope))]) {
    const section = make("section");
    section.append(make("h2", scope));
    const group = make("div", undefined, scope === "Backups" ? "paths backups" : "paths");
    group.append(...topology.flows.filter(flow => flow.scope === scope)
      .map(flow => path([[flow.from], [flow.to]], [flow.label])));
    section.append(group);
    flows.append(section);
  }
}

function checkKey(check) {
  return JSON.stringify([check.group, check.name]);
}

function renderServices() {
  if (!topology) return;
  const query = element("search").value.trim().toLowerCase();
  const access = element("filter").value;
  const filtered = topology.services.filter(service =>
    (!access || service.access === access) && [service.name, service.host].some(value => value.toLowerCase().includes(query)));
  element("total").textContent = filtered.length + " von " + topology.services.length + " Routen auf " + topology.host;
  element("services").replaceChildren(...filtered.map(service => {
    const row = make("li");
    const link = make("a", service.host);
    link.href = service.url;
    const detail = make("span", service.access + (service.port ? " · " + service.protocol.toUpperCase() + " " + service.port : " · statische Dateien"), "meta");
    const healthy = checks.get(checkKey(service.check));
    if (healthy !== undefined) detail.append(" · ", make("span", healthy ? "erreichbar" : "Prüfung fehlgeschlagen", healthy ? "up" : "down"));
    row.append(link, detail);
    return row;
  }));
}

async function getJson(path) {
  const response = await fetch(path, {cache: "no-store", signal: AbortSignal.timeout(8000)});
  if (!response.ok) throw new Error(response.statusText);
  return response.json();
}

async function refresh() {
  const [data, health] = await Promise.allSettled(preview
    ? [preview.topology, preview.statuses]
    : [getJson("topology.json"), getJson("status.json")]);
  let topologyChanged = false;
  if (data.status === "fulfilled") {
    if (JSON.stringify(data.value) !== JSON.stringify(topology)) {
      topology = data.value;
      topologyChanged = true;
      renderTopology();
    }
  }
  const live = health.status === "fulfilled";
  const updatedChecks = new Map(live ? health.value.flatMap(check => {
    const success = check.results?.at(-1)?.success;
    return typeof success === "boolean" ? [[checkKey(check), success]] : [];
  }) : []);
  if (topologyChanged || checks.size !== updatedChecks.size ||
      [...updatedChecks].some(([key, status]) => checks.get(key) !== status)) {
    checks = updatedChecks;
    renderServices();
  }
  element("state").textContent = data.status !== "fulfilled"
    ? (topology ? "Letzter verfügbarer Konfigurationsstand" : "Karte konnte nicht geladen werden")
    : preview ? "Vorschau aus der NixOS-Konfiguration"
    : live ? "Dienststatus geprüft um " + new Date().toLocaleTimeString("de-DE")
    : "Dienststatus derzeit nicht verfügbar";
  if (!preview) setTimeout(refresh, 30000);
}

element("search").addEventListener("input", renderServices);
element("filter").addEventListener("change", renderServices);
refresh();
</script>
</html>
