<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yomi · Infrastrukturkarte</title>
<style>
  :root {
    color-scheme: dark;
    --ink: var(--foreground, #e6eee8);
    --muted-ink: var(--muted-foreground, #a7bcb2);
    --paper: var(--card, #14231f);
    --line: var(--border, #3d5249);
    --route: var(--chart-2, #81dfbe);
    --backup: var(--chart-4, #f2cc8b);
    --down: var(--destructive, #ff9c92);
    background: var(--background, #0d1714);
    color: var(--ink);
    font: 15px/1.5 var(--font-sans, system-ui, sans-serif);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1000px; margin: auto; padding: clamp(14px, 4vw, 54px); }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(30px, 5vw, 55px); line-height: 1.08; letter-spacing: -.035em; }
  h2 { font-size: 20px; margin-block-end: 12px; }
  header { display: flex; align-items: end; gap: 14px 28px; justify-content: space-between; flex-wrap: wrap; }
  #state, .hint, .node small, .meta { color: var(--muted-ink); }
  #state { font-size: .83rem; }
  section { margin-top: 28px; }
  figure { margin: 0; }
  .topology {
    border: 1px solid var(--line); border-radius: 14px; padding: clamp(4px, 2vw, 20px);
    overflow-x: auto;
    background: var(--paper);
    --zone: var(--secondary, #192e28);
    --control: var(--chart-5, #d2b6ff);
    --tunnel: var(--chart-1, #92d1ff);
  }
  .topology svg {
    display: block; width: 100%; max-width: 530px; height: auto; margin: auto;
    font-family: system-ui, sans-serif;
  }
  .topology text { fill: var(--ink); font-size: 16px; }
  .topology .detail { fill: var(--muted-ink); font-size: 13px; }
  .topology .host { font-weight: 700; }
  .topology .zone { fill: var(--zone); stroke: var(--muted-ink); stroke-opacity: .55; }
  .topology .box { fill: var(--paper); stroke: var(--muted-ink); }
  .topology a:hover .box, .topology a:focus-visible .box { stroke: var(--route); stroke-width: 2; }
  .topology .wire {
    fill: none; stroke: var(--route); stroke-width: 1.6;
    stroke-linejoin: round; marker-end: url(#arrow);
  }
  .topology .tunnel { stroke: var(--tunnel); stroke-dasharray: 6 4; }
  .topology .control { stroke: var(--control); stroke-dasharray: 2 4; }
  .topology .tunnel-label { fill: var(--tunnel); }
  .topology .control-label { fill: var(--control); }
  .topology .edge-label {
    paint-order: stroke; stroke: var(--zone); stroke-width: 5; stroke-linejoin: round;
  }
  .topology .dim .box, .topology .dim .wire, .topology .dim .edge-label { opacity: .25; }
  .topology .dim .lit .box, .topology .dim .lit.wire, .topology .dim .lit.edge-label { opacity: 1; }
  .paths { display: grid; gap: 2px; }
  .path {
    list-style: none; padding: 12px; margin: 0; display: flex;
    align-items: center; background: var(--paper); min-width: 0;
  }
  .path:first-child { border-radius: 12px 12px 0 0; }
  .path:last-child { border-radius: 0 0 12px 12px; }
  .node { flex: 1; min-width: 0; padding: 6px 8px; overflow-wrap: anywhere; }
  .node strong, .node small { display: block; }
  .node strong { font-weight: 650; }
  .edge {
    flex: 1.2; min-width: 0; color: var(--route); text-align: center;
    font-size: .76rem; overflow-wrap: anywhere; padding-inline: 4px;
  }
  .edge::after {
    content: ""; display: block; height: 9px; margin-top: 3px;
    background: currentColor;
    clip-path: polygon(0 42%, calc(100% - 7px) 42%, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, calc(100% - 7px) 58%, 0 58%);
  }
  .backups .edge { color: var(--backup); }
  .flows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 275px), 1fr)); gap: 20px; }
  .hosts { font-size: .9rem; color: var(--muted-ink); margin-top: 12px; overflow-wrap: anywhere; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input, select {
    font: inherit; color: inherit; background: var(--paper);
    border: 1px solid var(--line); padding: 7px 10px; border-radius: 6px;
  }
  input { flex: 1; min-width: min(190px, 100%); }
  a { color: var(--route); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--route); outline-offset: 3px; }
  ::selection { background: var(--route); color: #102018; }
  .services { list-style: none; margin: 0; padding: 0; }
  .services li {
    display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; border-bottom: 1px solid var(--line); padding: 9px 0;
  }
  .services a { overflow-wrap: anywhere; }
  .meta { font-size: .83rem; }
  .up { color: var(--route); }
  .down { color: var(--down); }
  .hint { margin-top: 8px; font-size: .86rem; }
</style>
<main>
  <header>
    <h1>Infrastrukturkarte</h1>
    <p id="state" role="status">Karte wird geladen …</p>
  </header>
  <section aria-labelledby="access-title">
    <h2 id="access-title">Netzarchitektur</h2>
    <figure class="topology" id="network-map" hidden>
      <svg id="diagram" role="group" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">Zugangswege zu Inari</title>
        <desc id="diagram-desc"></desc>
        <defs>
          <marker id="arrow" viewBox="0 0 8 8" markerWidth="6" markerHeight="6" refX="7" refY="4" orient="auto-start-reverse">
            <path d="M0 0L8 4L0 8Z" fill="context-stroke"/>
          </marker>
        </defs>
        <g id="diagram-body"></g>
      </svg>
      <figcaption class="hosts" id="hosts"></figcaption>
    </figure>
  </section>
  <div class="flows" id="flows"></div>
  <section aria-labelledby="services-title">
    <h2 id="services-title">Webdienste</h2>
    <div class="controls">
      <input type="search" id="search" aria-label="Dienste durchsuchen" placeholder="Dienst oder Hostname suchen">
      <select id="filter" aria-label="Zugangsweg filtern">
        <option value="">Alle Zugangswege</option>
        <option>nginx</option>
        <option>Pangolin</option>
      </select>
    </div>
    <p class="hint" id="total" aria-live="polite"></p>
    <ul class="services" id="services"></ul>
  </section>
  <noscript>Die Infrastrukturkarte benötigt JavaScript.</noscript>
</main>
<script>
"use strict";

const preview = null;
const element = id => document.getElementById(id);
let topology;
let checks = new Map();

function make(tag, value, className) {
  const item = document.createElement(tag);
  if (value !== undefined) item.textContent = value;
  if (className) item.className = className;
  return item;
}

function path(nodes, edges) {
  const row = make("ol", undefined, "path");
  nodes.forEach(([name, detail], index) => {
    if (index) row.append(make("li", edges[index - 1], "edge"));
    const node = make("li", undefined, "node");
    node.append(make("strong", name));
    if (detail) node.append(make("small", detail));
    row.append(node);
  });
  return row;
}

const SVG = "http://www.w3.org/2000/svg";
const measure = document.createElement("canvas").getContext("2d");

function svg(tag, attributes, text) {
  const item = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) item.setAttribute(name, value);
  if (text !== undefined) item.textContent = text;
  return item;
}

function textWidth(text, size) {
  measure.font = size + "px system-ui, sans-serif";
  return measure.measureText(text || "").width;
}

// Layered layout: zones stack top to bottom, data edges define rows within a
// zone, and control edges only connect what the data path already placed.
function layout(graph) {
  const NODE_H = 52, GAP_X = 26, GAP_Y = 62, ZONE_HEAD = 34, PAD = 14, DUMMY_W = 12;
  const zoneIndex = new Map(graph.zones.map((zone, index) => [zone.id, index]));
  const nodes = new Map(graph.nodes.map((node, order) => [node.id, {
    ...node, order, dummy: false,
    w: Math.max(118, textWidth(node.label, 16), textWidth(node.detail, 13)) + 22,
  }]));
  const flowEdges = graph.edges.filter(edge => edge.kind !== "control");

  const rank = new Map();
  let base = 0;
  for (const zone of graph.zones) {
    const members = [...nodes.values()].filter(node => node.zone === zone.id);
    if (!members.length) continue;
    for (let pass = 0; pass <= members.length; pass++) {
      for (const node of members) {
        const before = flowEdges.filter(edge => edge.to === node.id && rank.has(edge.from))
          .map(edge => rank.get(edge.from) + 1);
        rank.set(node.id, Math.max(base, ...before));
      }
    }
    base = Math.max(...members.map(node => rank.get(node.id))) + 1;
  }

  // Edges that skip rows get invisible waypoints so they keep their own lane.
  const routes = graph.edges.map((edge, index) => {
    const points = [edge.from];
    if (edge.kind !== "control") {
      for (let r = rank.get(edge.from) + 1; r < rank.get(edge.to); r++) {
        const id = "dummy-" + index + "-" + r;
        nodes.set(id, {id, dummy: true, w: DUMMY_W, order: nodes.size});
        rank.set(id, r);
        points.push(id);
      }
    }
    points.push(edge.to);
    return {...edge, points, index};
  });

  const rows = [];
  for (const [id, r] of rank) (rows[r] ||= []).push(nodes.get(id));
  const links = new Map([...nodes.keys()].map(id => [id, []]));
  for (const route of routes) {
    route.points.slice(1).forEach((id, i) => {
      links.get(id).push(route.points[i]);
      links.get(route.points[i]).push(id);
    });
  }

  function place(row, wanted) {
    row.sort((a, b) => wanted(a) - wanted(b) || a.order - b.order);
    let right = -Infinity;
    for (const node of row) {
      node.x = Math.max(wanted(node) - node.w / 2, right + GAP_X);
      right = node.x + node.w;
    }
    const shift = row.reduce((sum, node) => sum + wanted(node) - node.x - node.w / 2, 0) / row.length;
    for (const node of row) node.x += shift;
  }
  const centre = node => node.x + node.w / 2;
  function towards(neighbourRows) {
    return node => {
      const placed = links.get(node.id).map(id => nodes.get(id)).filter(other => neighbourRows.includes(rank.get(other.id)));
      return placed.length ? placed.reduce((sum, other) => sum + centre(other), 0) / placed.length : centre(node);
    };
  }
  let start = 0;
  for (const node of rows[0] || []) { node.x = start; start += node.w + GAP_X; }
  for (let r = 1; r < rows.length; r++) {
    for (const node of rows[r]) node.x = 0;
    place(rows[r], node => {
      const placed = links.get(node.id).map(id => nodes.get(id)).filter(other => rank.get(other.id) < r);
      return placed.length ? placed.reduce((sum, other) => sum + centre(other), 0) / placed.length : node.order * 40;
    });
  }
  for (let sweep = 0; sweep < 3; sweep++) {
    for (let r = rows.length - 2; r >= 0; r--) place(rows[r], towards([r + 1]));
    for (let r = 1; r < rows.length; r++) place(rows[r], towards([r - 1]));
  }

  let y = 0;
  const rowTop = [];
  rows.forEach((row, r) => {
    const zone = row.find(node => !node.dummy)?.zone;
    const previous = rows[r - 1]?.find(node => !node.dummy)?.zone;
    if (zone !== previous && graph.zones[zoneIndex.get(zone)]?.frame !== false) y += ZONE_HEAD;
    rowTop[r] = y;
    for (const node of row) node.y = y;
    y += NODE_H + GAP_Y;
  });

  const zones = graph.zones.filter(zone => zone.frame !== false).flatMap(zone => {
    const members = [...nodes.values()].filter(node => node.zone === zone.id);
    if (!members.length) return [];
    const x = Math.min(...members.map(node => node.x)) - PAD;
    const top = Math.min(...members.map(node => node.y)) - ZONE_HEAD;
    const width = Math.max(...members.map(node => node.x + node.w)) + PAD - x;
    const height = Math.max(...members.map(node => node.y)) + NODE_H + PAD - top;
    return [{...zone, x, y: top, width: Math.max(width, textWidth(zone.label + "  " + (zone.detail || ""), 14) + 2 * PAD), height}];
  });

  return {nodes, routes, zones, rank, NODE_H, height: y - GAP_Y};
}

function drawTopology(graph, host) {
  const {nodes, routes, zones, rank, NODE_H, height} = layout(graph);
  const body = element("diagram-body");
  body.replaceChildren();
  const real = [...nodes.values()].filter(node => !node.dummy);
  const left = Math.min(...real.map(node => node.x), ...zones.map(zone => zone.x)) - 6;
  const right = Math.max(...real.map(node => node.x + node.w), ...zones.map(zone => zone.x + zone.width)) + 6;
  const bottom = Math.max(height, ...zones.map(zone => zone.y + zone.height)) + 6;
  const diagram = element("diagram");
  diagram.setAttribute("viewBox", [left, -6, right - left, bottom + 6].join(" "));
  // Phones scroll the map sideways rather than shrinking labels below legibility.
  diagram.style.maxWidth = Math.round(right - left) + "px";
  diagram.style.minWidth = Math.round((right - left) * .8) + "px";

  for (const zone of zones) {
    const group = svg("g", {});
    group.append(svg("rect", {class: "zone", x: zone.x, y: zone.y, width: zone.width, height: zone.height, rx: 9}));
    group.append(svg("text", {class: "host", x: zone.x + 14, y: zone.y + 23}, zone.label));
    if (zone.detail) group.append(svg("text", {class: "detail", x: zone.x + zone.width - 14, y: zone.y + 23, "text-anchor": "end"}, zone.detail));
    body.append(group);
  }

  // Spread the ends of several edges along a box side instead of stacking them.
  const ports = new Map();
  function port(id, side, other) {
    const key = id + side;
    if (!ports.has(key)) ports.set(key, []);
    ports.get(key).push(other);
  }
  const segments = routes.flatMap(route => route.points.slice(1).map((to, i) => {
    const from = route.points[i];
    const a = nodes.get(from), b = nodes.get(to);
    const down = rank.get(to) > rank.get(from), up = rank.get(to) < rank.get(from);
    const sides = down ? ["bottom", "top"] : up ? ["top", "bottom"] : a.x < b.x ? ["right", "left"] : ["left", "right"];
    const segment = {route, from, to, sides};
    port(from, sides[0], segment);
    port(to, sides[1], segment);
    return segment;
  }));
  function anchor(id, side, segment) {
    const node = nodes.get(id);
    const list = ports.get(id + side);
    const otherX = item => { const other = nodes.get(item.from === id ? item.to : item.from); return other.x + other.w / 2; };
    const sorted = [...list].sort((p, q) => otherX(p) - otherX(q));
    const slot = node.dummy ? .5 : (sorted.indexOf(segment) + 1) / (list.length + 1);
    if (side === "top") return [node.x + node.w * slot, node.y + (node.dummy ? NODE_H / 2 : 0)];
    if (side === "bottom") return [node.x + node.w * slot, node.y + (node.dummy ? NODE_H / 2 : NODE_H)];
    return [side === "left" ? node.x : node.x + node.w, node.y + NODE_H / 2];
  }

  const wires = svg("g", {});
  const labels = svg("g", {});
  // Labels avoid boxes, zone headings and each other; boxes are stored as
  // text baselines, so a box covers [y - 11, y + 4].
  const taken = [
    ...real.map(node => ({x: node.x, y: node.y + 11, w: node.w, h: NODE_H + 4})),
    ...zones.map(zone => ({x: zone.x, y: zone.y + 11, w: zone.width, h: 26})),
  ];
  const clashes = (x, y, w) => taken.some(box =>
    x < box.x + box.w && x + w > box.x && y + 4 > box.y - 11 && y - 11 < box.y - 11 + (box.h || 15));
  for (const route of routes) {
    const parts = segments.filter(segment => segment.route === route);
    let d = "";
    const points = [];
    for (const segment of parts) {
      const [x1, y1] = anchor(segment.from, segment.sides[0], segment);
      const [x2, y2] = anchor(segment.to, segment.sides[1], segment);
      if (!d) d = "M" + x1 + " " + y1;
      else d += "L" + x1 + " " + y1;
      if (segment.sides[0] === "left" || segment.sides[0] === "right") {
        const mx = (x1 + x2) / 2;
        d += "C" + [mx, y1, mx, y2, x2, y2].join(" ");
      } else {
        const my = (y1 + y2) / 2;
        d += "C" + [x1, my, x2, my, x2, y2].join(" ");
      }
      points.push([x1, y1], [x2, y2]);
    }
    const kind = route.kind ? " " + route.kind : "";
    const ends = "edge-" + route.from + " edge-" + route.to;
    wires.append(svg("path", {class: "wire" + kind + " " + ends, d}));
    if (!route.label) continue;
    const [x1, y1] = points[0], [x2, y2] = points[1];
    const width = textWidth(route.label, 13);
    // Side-by-side boxes leave little room: centre the label above the wire.
    const level = y1 === y2;
    let lx = level ? (x1 + x2 - width) / 2 : (x1 + x2) / 2 + 6;
    let ly = level ? y1 - 7 : (y1 + y2) / 2 + 4;
    const offsets = [0, -16, 16, -32, 32, -48, 48];
    const shift = offsets.find(offset => !clashes(lx, ly + offset, width));
    ly += shift ?? 0;
    taken.push({x: lx, y: ly, w: width});
    labels.append(svg("text", {class: "detail edge-label" + (route.kind ? " " + route.kind + "-label" : "") + " " + ends, x: lx, y: ly}, route.label));
  }
  body.append(wires);

  for (const node of real) {
    const group = svg(node.href ? "a" : "g", {class: "node-" + node.id});
    if (node.href) group.setAttribute("href", node.href);
    else group.setAttribute("tabindex", "0");
    group.append(svg("rect", {class: "box", x: node.x, y: node.y, width: node.w, height: NODE_H, rx: 5}));
    const cx = node.x + node.w / 2;
    group.append(svg("text", {x: cx, y: node.y + (node.detail ? 22 : 31), "text-anchor": "middle"}, node.label));
    if (node.detail) group.append(svg("text", {class: "detail", x: cx, y: node.y + 40, "text-anchor": "middle"}, node.detail));
    for (const event of ["mouseenter", "focus"]) group.addEventListener(event, () => highlight(node.id));
    for (const event of ["mouseleave", "blur"]) group.addEventListener(event, () => highlight());
    body.append(group);
  }
  body.append(labels);

  const name = id => nodes.get(id).label;
  element("diagram-title").textContent = "Zugangswege zu " + graph.zones.find(zone => zone.id === host)?.label;
  element("diagram-desc").textContent = graph.edges
    .map(edge => name(edge.from) + " → " + name(edge.to) + (edge.label ? " (" + edge.label + ")" : "")).join("; ");

  function highlight(id) {
    body.classList.toggle("dim", Boolean(id));
    for (const item of body.querySelectorAll(".lit")) item.classList.remove("lit");
    if (!id) return;
    const related = new Set([id]);
    for (const edge of graph.edges) if (edge.from === id || edge.to === id) related.add(edge.from).add(edge.to);
    for (const other of related) body.querySelector(".node-" + CSS.escape(other))?.classList.add("lit");
    for (const item of body.querySelectorAll(".edge-" + CSS.escape(id))) item.classList.add("lit");
  }
}

function renderTopology() {
  drawTopology(topology.graph, topology.host);
  element("hosts").textContent = "Konfigurierte Systeme · " + topology.hosts.join(" · ");
  element("network-map").hidden = false;

  const flows = element("flows");
  flows.replaceChildren();
  for (const scope of [...new Set(topology.flows.map(flow => flow.scope))]) {
    const section = make("section");
    section.append(make("h2", scope));
    const group = make("div", undefined, scope === "Backups" ? "paths backups" : "paths");
    group.append(...topology.flows.filter(flow => flow.scope === scope)
      .map(flow => path([[flow.from], [flow.to]], [flow.label])));
    section.append(group);
    flows.append(section);
  }
}

function checkKey(check) {
  return JSON.stringify([check.group, check.name]);
}

function renderServices() {
  if (!topology) return;
  const query = element("search").value.trim().toLowerCase();
  const access = element("filter").value;
  const filtered = topology.services.filter(service =>
    (!access || service.access === access) && [service.name, service.host].some(value => value.toLowerCase().includes(query)));
  element("total").textContent = filtered.length + " von " + topology.services.length + " Routen auf " + topology.host;
  element("services").replaceChildren(...filtered.map(service => {
    const row = make("li");
    const link = make("a", service.host);
    link.href = service.url;
    const detail = make("span", service.access + (service.port ? " · " + service.protocol.toUpperCase() + " " + service.port : " · statische Dateien"), "meta");
    const healthy = checks.get(checkKey(service.check));
    if (healthy !== undefined) detail.append(" · ", make("span", healthy ? "erreichbar" : "Prüfung fehlgeschlagen", healthy ? "up" : "down"));
    row.append(link, detail);
    return row;
  }));
}

async function getJson(path) {
  const response = await fetch(path, {cache: "no-store", signal: AbortSignal.timeout(8000)});
  if (!response.ok) throw new Error(response.statusText);
  return response.json();
}

async function refresh() {
  const [data, health] = await Promise.allSettled(preview
    ? [preview.topology, preview.statuses]
    : [getJson("topology.json"), getJson("status.json")]);
  let topologyChanged = false;
  if (data.status === "fulfilled") {
    if (JSON.stringify(data.value) !== JSON.stringify(topology)) {
      topology = data.value;
      topologyChanged = true;
      renderTopology();
    }
  }
  const live = health.status === "fulfilled";
  const updatedChecks = new Map(live ? health.value.flatMap(check => {
    const success = check.results?.at(-1)?.success;
    return typeof success === "boolean" ? [[checkKey(check), success]] : [];
  }) : []);
  if (topologyChanged || checks.size !== updatedChecks.size ||
      [...updatedChecks].some(([key, status]) => checks.get(key) !== status)) {
    checks = updatedChecks;
    renderServices();
  }
  element("state").textContent = data.status !== "fulfilled"
    ? (topology ? "Letzter verfügbarer Konfigurationsstand" : "Karte konnte nicht geladen werden")
    : preview ? "Vorschau aus der NixOS-Konfiguration"
    : live ? "Dienststatus geprüft um " + new Date().toLocaleTimeString("de-DE")
    : "Dienststatus derzeit nicht verfügbar";
  if (!preview) setTimeout(refresh, 30000);
}

element("search").addEventListener("input", renderServices);
