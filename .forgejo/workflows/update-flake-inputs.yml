name: Update Flake Inputs
on:
  # Mondays and Thursdays rather than daily. Every lock bump that moves
  # stdenv rebuilds the world for four host configurations, and the write
  # volume lands on the NVMe holding zroot, which is already near its rated
  # endurance. Two batched updates a week instead of seven, at the cost of
  # security patches arriving up to three days later.
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:
concurrency:
  group: update-flake-inputs
  cancel-in-progress: false
# The update lands as a PR, never a direct push. It merges on its own only
# when the job's checks and
# the deterministic gate say yes. Every new PR also pushes its link to a human
# through the alert router, as does any PR that is not merged. See
# scripts/ci/update-package-pr.py for the decision.
#
# `just lint` and `just check` run code from the updated inputs (devshell
# hooks, evaluation) as the runner user. So: no credentials are kept in the
# checkout, the gate runs before that step from copies taken
# before the update, the last step verifies those copies by hash and the
# recorded commit, and only the last step sees the token.
jobs:
  update:
    runs-on: native
    # 180 for just check as before, plus the PR round trip.
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        # Explicit bash adds pipefail, so `| tee` cannot hide a failure.
        shell: bash
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Keep trusted copies of the pipeline scripts
        id: trusted
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/update.XXXXXX")
          cp scripts/ci/update-gate.py scripts/ci/update-package-pr.py "$dir/"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "sums=$(cd "$dir" && sha256sum ./*.py | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Update flake inputs
        run: nix flake update
      - name: Commit to the update branch
        id: commit
        env:
          GIT_AUTHOR_NAME: forgejo-actions
          GIT_AUTHOR_EMAIL: forgejo-actions@localhost
          GIT_COMMITTER_NAME: forgejo-actions
          GIT_COMMITTER_EMAIL: forgejo-actions@localhost
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -B update-flake-inputs
          git commit -m "chore: update flake inputs" -- flake.lock
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deterministic gate
        id: gate
        if: steps.commit.outputs.changed == 'true'
        env:
          DIR: ${{ steps.trusted.outputs.dir }}
        run: |
          if python3 "$DIR/update-gate.py" --base "${{ steps.commit.outputs.base }}" > "$DIR/gate.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$DIR/gate.json"
      - name: Lint and flake checks
        id: ci
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: just lint && just check
      - name: Open the PR and merge or notify
        if: steps.commit.outputs.changed == 'true'
        env:
          DIR: ${{ steps.trusted.outputs.dir }}
          SUMS: ${{ steps.trusted.outputs.sums }}
          HEAD_SHA: ${{ steps.commit.outputs.head }}
          GITHUB_TOKEN: ${{ secrets.UPDATE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          UPDATE_BOT_TOKEN: ${{ secrets.UPDATE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Steps before this one ran upstream code; refuse to act on a
          # changed script or a moved branch.
          test "$(cd "$DIR" && sha256sum ./update-gate.py ./update-package-pr.py | sha256sum | cut -d' ' -f1)" = "$SUMS"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          body="$DIR/body.md"
          {
            echo "Automated flake input update."
            echo
            echo "- CI: ${{ steps.ci.outcome }}"
            echo "- Gate: ${{ steps.gate.outputs.ok || 'did not run' }}"
            echo
            echo '```json'
            cat "$DIR/gate.json" 2>/dev/null || true
            echo '```'
          } > "$body"
          # Pushes made with the automatic token start no workflow, so the
          # PR's own CI run needs UPDATE_BOT_TOKEN. Without it nothing merges.
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: basic $auth"
          python3 "$DIR/update-package-pr.py" "$body" \
            --branch update-flake-inputs --title "chore: update flake inputs" \
            --ci-outcome "${{ steps.ci.outcome }}" \
            --gate "$DIR/gate.json" --gate-ok "${{ steps.gate.outputs.ok }}"
