name: Update Packages
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
concurrency:
  group: update-packages
  cancel-in-progress: false
# Updates land as a PR that merges on its own only when the job's checks,
# the deterministic gate and the local model all say yes; otherwise the
# alert router pushes the PR link to a human. The same trust boundary as in
# update-flake-inputs.yml: no credentials in the checkout, gate and review
# from copies taken before the update, token only in the last step.
jobs:
  update:
    runs-on: native
    # 180 for the updates and just check as before, plus up to 30 for the
    # local model and the PR round trip.
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        # Explicit bash adds pipefail, so `| tee` cannot hide a failure.
        shell: bash
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Keep trusted copies of the pipeline scripts
        id: trusted
        run: |
          dir=$(mktemp -d "$RUNNER_TEMP/update.XXXXXX")
          cp scripts/ci/update-gate.py scripts/ci/update-llm-review.py scripts/ci/update-package-pr.py "$dir/"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "sums=$(cd "$dir" && sha256sum ./*.py | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # Read the model's port from the registry now, while the lock is
          # still main's: evaluating after the update would run new inputs.
          port=$(nix eval --accept-flake-config --raw .#nixosConfigurations.inari.config.yomi.ports.llama-cpp --apply toString)
          echo "llm=http://127.0.0.1:$port/v1/chat/completions" >> "$GITHUB_OUTPUT"

      - name: Update GitHub-release packages with nix-update
        run: |
          for pkg in cliproxyapi-copilot-plugin helium pelican-wings suwayomi-server; do
            echo "::group::nix-update $pkg"
            if nix run nixpkgs#nix-update -- --flake "$pkg"; then
              if nix build ".#$pkg" --no-link; then
                echo "$pkg updated and builds"
              else
                echo "$pkg failed to build after update, reverting" >&2
                git checkout -- "pkgs/$pkg.nix"
              fi
            else
              echo "nix-update failed for $pkg, skipping" >&2
              git checkout -- "pkgs/$pkg.nix"
            fi
            echo "::endgroup::"
          done

      - name: Update vimclip to latest master commit
        run: |
          echo "::group::nix-update vimclip"
          if nix run nixpkgs#nix-update -- --flake vimclip --version=branch=master; then
            if nix build .#vimclip --no-link; then
              echo "vimclip updated and builds"
            else
              echo "vimclip failed to build after update, reverting" >&2
              git checkout -- pkgs/vimclip.nix
            fi
          else
            echo "nix-update failed for vimclip, skipping" >&2
            git checkout -- pkgs/vimclip.nix
          fi
          echo "::endgroup::"

      - name: Update chatgpt from vendor apt index
        run: |
          echo "::group::update chatgpt"
          set +e
          packagesUrl="https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages"
          newVersion=$(curl -fsSL "$packagesUrl" | awk -F': ' '/^Version:/ {print $2; exit}')
          if [[ -z "$newVersion" ]]; then
            echo "could not determine latest chatgpt version, skipping" >&2
          else
            debUrl="https://persistent.oaistatic.com/codex-app-prod/linux/deb/pool/main/c/chatgpt/chatgpt_${newVersion}_amd64.deb"
            newHash=$(nix store prefetch-file --hash-type sha256 --json "$debUrl" | nix run nixpkgs#jq -- -r '.hash')
            if [[ -z "$newHash" || "$newHash" == "null" ]]; then
              echo "could not prefetch hash for chatgpt $newVersion, skipping" >&2
            else
              sed -i \
                -e "s|version = \".*\";|version = \"${newVersion}\";|" \
                -e "s|hash = \"sha256-[^\"]*\";|hash = \"${newHash}\";|" \
                pkgs/chatgpt.nix
              if nix build .#chatgpt --no-link; then
                echo "chatgpt updated to $newVersion and builds"
              else
                echo "chatgpt $newVersion failed to build, reverting" >&2
                git checkout -- pkgs/chatgpt.nix
              fi
            fi
          fi
          set -e
          echo "::endgroup::"

      - name: Update pinned docker image digests
        run: |
          echo "::group::update-docker-digests"
          nix develop -c bash scripts/ci/update-docker-digests.sh
          echo "::endgroup::"

      - name: Commit to the update branch
        id: commit
        env:
          GIT_AUTHOR_NAME: forgejo-actions
          GIT_AUTHOR_EMAIL: forgejo-actions@localhost
          GIT_COMMITTER_NAME: forgejo-actions
          GIT_COMMITTER_EMAIL: forgejo-actions@localhost
        run: |
          if git diff --quiet -- pkgs/ hosts/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -B update-packages
          git add pkgs/ hosts/
          git commit -m "chore: update packages"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deterministic gate
        id: gate
        if: steps.commit.outputs.changed == 'true'
        env:
          DIR: ${{ steps.trusted.outputs.dir }}
        run: |
          if python3 "$DIR/update-gate.py" --base "${{ steps.commit.outputs.base }}" > "$DIR/gate.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$DIR/gate.json"

      - name: Review by the local model
        id: review
        if: steps.gate.outputs.ok == 'true'
        timeout-minutes: 30
        env:
          DIR: ${{ steps.trusted.outputs.dir }}
        run: |
          git diff "${{ steps.commit.outputs.base }}" HEAD -- pkgs/ hosts/ > "$DIR/diff.txt"
          if python3 "$DIR/update-llm-review.py" --diff "$DIR/diff.txt" --url "${{ steps.trusted.outputs.llm }}" > "$DIR/review.json"; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$DIR/review.json"

      - name: Lint and flake checks
        id: ci
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: just lint && just check

      - name: Open the PR and merge or notify
        if: steps.commit.outputs.changed == 'true'
        env:
          DIR: ${{ steps.trusted.outputs.dir }}
          SUMS: ${{ steps.trusted.outputs.sums }}
          HEAD_SHA: ${{ steps.commit.outputs.head }}
          BASE: ${{ steps.commit.outputs.base }}
          GITHUB_TOKEN: ${{ secrets.UPDATE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          UPDATE_BOT_TOKEN: ${{ secrets.UPDATE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Steps before this one ran upstream code; refuse to act on a
          # changed script or a moved branch.
          test "$(cd "$DIR" && sha256sum ./update-gate.py ./update-llm-review.py ./update-package-pr.py | sha256sum | cut -d' ' -f1)" = "$SUMS"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          summary=""
          for f in $(git diff --name-only "$BASE" HEAD -- pkgs/ hosts/); do
            pkg=$(basename "$f" .nix)
            old=$(git show "$BASE:$f" 2>/dev/null | sed -n 's/.*version = "\([^"]*\)".*/\1/p' | head -1)
            new=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' "$f" | head -1)
            if [[ -n "$old" && -n "$new" ]]; then
              summary="${summary}- **${pkg}**: \`${old}\` -> \`${new}\`"$'\n'
            else
              summary="${summary}- **${pkg}**: updated"$'\n'
            fi
          done

          diffSummary=$(git diff "$BASE" HEAD -- pkgs/ hosts/ | head -c 60000 || true)
          checks="- CI: ${{ steps.ci.outcome }}"$'\n'"- Gate: ${{ steps.gate.outputs.ok || 'did not run' }}"$'\n'"- LLM review: ${{ steps.review.outputs.safe || 'skipped' }}"
          # Keep the Markdown code fences literal.
          # shellcheck disable=SC2016
          body=$(printf '%s\n\n%s\n<details>\n<summary>Show diff</summary>\n\n```diff\n%s\n```\n\n</details>\n' "$checks" "$summary" "$diffSummary")
          printf '%s' "$body" > "$DIR/body.md"

          # Pushes made with the automatic token start no workflow, so the
          # PR's own CI run needs UPDATE_BOT_TOKEN. Without it nothing merges.
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: basic $auth"
          python3 "$DIR/update-package-pr.py" "$DIR/body.md" \
            --ci-outcome "${{ steps.ci.outcome }}" \
            --gate "$DIR/gate.json" --gate-ok "${{ steps.gate.outputs.ok }}" \
            --review "$DIR/review.json" --review-ok "${{ steps.review.outputs.safe }}"
