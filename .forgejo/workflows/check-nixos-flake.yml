name: Check NixOS Flake
on:
  push:
  workflow_dispatch:
concurrency:
  group: check-nixos-flake
  cancel-in-progress: true
jobs:
  check:
    runs-on: native
    env:
      # flake.nix nixConfig carries the binary caches. Nix ignores it with an
      # "untrusted flake configuration" warning unless it is accepted, and the
      # runner would then miss every cache but cache.nixos.org.
      NIX_CONFIG: accept-flake-config = true
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The secret scan needs the pushed range's parents: in a depth-1
          # clone the tip has none, and gitleaks then scans the whole tree.
          fetch-depth: 0
      - name: Scan for secrets
        # Only the commits this push added. Older history still holds the
        # retired Authentik .env (S-02), whose dead values would fail every run.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="-1"
          fi
          nix run nixpkgs#gitleaks -- git --no-banner --redact --log-opts="$range"
      - name: Check formatting
        run: just lint
      - name: Test the update PR pipeline (publish, gate, LLM review)
        run: nix develop -c python3 -m unittest discover -s tests -p "test_update_*.py"
      - name: Run flake checks
        run: just check
      - name: Push host builds to hugo-berendi.cachix.org
        # Only what landed on main: the hosts trust this cache, so a branch or
        # an unreviewed update PR must never write to it. The token is in this
        # step alone, after every step that runs code from the checkout.
        # Without the CACHIX_AUTH_TOKEN repo secret the step does nothing.
        # The builds are already in the local store, so nothing rebuilds here.
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo "CACHIX_AUTH_TOKEN is not set, skipping the cache push"
            exit 0
          fi
          for host in inari amaterasu tsukuyomi wsl-work; do
            nix build --accept-flake-config --no-link --print-out-paths \
              ".#checks.x86_64-linux.nixos-$host"
          done | nix run nixpkgs#cachix -- push hugo-berendi
