name: Check NixOS Flake
on:
  push:
  workflow_dispatch:
concurrency:
  group: check-nixos-flake
  cancel-in-progress: true
jobs:
  check:
    runs-on: native
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check formatting
        run: just lint
      - name: Run flake checks
        run: just check
